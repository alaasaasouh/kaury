<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="16" fill="#D8003A"/>
  <!-- Stylized W with speed lines -->
  <g fill="white">
    <!-- Speed lines left -->
    <rect x="18" y="58" width="32" height="7" rx="3.5" opacity="0.9"/>
    <rect x="24" y="72" width="24" height="7" rx="3.5" opacity="0.9"/>
    <rect x="30" y="86" width="16" height="7" rx="3.5" opacity="0.9"/>
    <!-- W shape -->
